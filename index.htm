<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Arena | اختبار الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-[#111827] border border-[#1f2937] rounded-2xl p-6 md:p-10 shadow-2xl relative">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-emerald-500 rounded-t-2xl"></div>

        <div class="text-center mb-8">
            <img src="https://cdn.discordapp.com/icons/1339585897175191614/449360369e070e5c7462296ff12fb3be.webp?size=4096" 
                 alt="Eagle Arena" class="w-24 h-24 mx-auto rounded-full border-2 border-emerald-500 object-cover mb-3 shadow-lg">
            <h1 class="text-3xl font-black text-white">Eagle Arena</h1>
            <p class="text-emerald-400 font-semibold mt-1">نظام قبول طاقم الإدارة</p>
        </div>

        <!-- الخطوة 1: البيانات -->
        <div id="step-1" class="space-y-4">
            <h2 class="text-xl font-bold text-white border-b border-gray-800 pb-2">1. بيانات المتقدم الأساسية</h2>
            <form id="info-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">الاسم الحقيقي:</label>
                    <input type="text" id="name" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:border-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">يوزر الديسكورد:</label>
                    <input type="text" id="discord" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:border-emerald-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-1">العمر:</label>
                        <input type="number" id="age" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:border-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-1">مسؤول قبولك:</label>
                        <input type="text" id="acceptor" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:border-emerald-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">سبب دخولك للإدارة:</label>
                    <textarea id="reason" required rows="3" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white focus:border-emerald-500 focus:outline-none resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-black py-4 rounded-xl transition-all text-lg shadow-lg">
                    إرسال البيانات والبدء في الاختبار 🚀
                </button>
            </form>
        </div>

        <!-- الخطوة 2: الأسئلة -->
        <div id="step-2" class="hidden space-y-6">
            <h2 class="text-xl font-bold text-white border-b border-gray-800 pb-2">2. اختبار الكفاءة الإدارية (17 سؤال)</h2>
            <form id="exam-form" class="space-y-6">
                
                <!-- الأسئلة من 1 إلى 17 مبسطة -->
                <div class="space-y-6" id="questions-container">
                    <!-- س 1 -->
                    <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-800">
                        <p class="font-bold text-white mb-2">1. شخص يشتم الإدارة واللاعبين بالعام، وش تصرفك الفوري؟</p>
                        <div class="space-y-2 text-sm text-gray-300">
                            <label class="block"><input type="radio" name="q1" value="a" required> أ) أشتمه عشان يتربى</label>
                            <label class="block"><input type="radio" name="q1" value="b"> ب) أعطيه كتم أو باند حسب اللائحة وأبلغ الإدارة بصمت</label>
                            <label class="block"><input type="radio" name="q1" value="c"> ج) أسحب عليه لين يدخل غيري</label>
                            <label class="block"><input type="radio" name="q1" value="d"> د) أتناقش معه وأسبه بالخاص</label>
                        </div>
                    </div>

                    <!-- س 2 -->
                    <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-800">
                        <p class="font-bold text-white mb-2">2. لاعبين تضاربوا وسبوا بعض بروم صوتي، وش الإجراء الصحيح؟</p>
                        <div class="space-y-2 text-sm text-gray-300">
                            <label class="block"><input type="radio" name="q2" value="a" required> أ) أعطيهم كلهم باند بدون كلام</label>
                            <label class="block"><input type="radio" name="q2" value="b"> ب) أنبههم بالهدوء وإذا استمروا كتم (Mute) وأفهم المشكلة بحيادية</label>
                            <label class="block"><input type="radio" name="q2" value="c"> ج) أشجعهم عشان يصير حماس</label>
                            <label class="block"><input type="radio" name="q2" value="d"> د) أطلع من الروم وأطنشهم</label>
                        </div>
                    </div>

                    <!-- س 3 -->
                    <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-800">
                        <p class="font-bold text-white mb-2">3. لاعب يشتكي أن إداري ظلمه أو عطاه باند بالغلط، كيف تتصرف؟</p>
                        <div class="space-y-2 text-sm text-gray-300">
                            <label class="block"><input type="radio" name="q3" value="a" required> أ) أقول له الإدارة ما تغلط</label>
                            <label class="block"><input type="radio" name="q3" value="b"> ب) أطلب الدليل وأناقش الموضوع مع الإداري بحيادية بع
